spring:
  application:
    name: countryService

  grpc:
    server:
      servlet:
        enabled: false

  datasource:
    url: 'jdbc:postgresql://localhost:5432/countrydb'
    username: postgres
    password: secret
    hikari:
      connection-timeout: 20000
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 10000
      max-lifetime: 1000
      auto-commit: true
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true
    path: /graphql
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    open-in-view: false

  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    locations: classpath:db/migration
    validate-on-migrate: true



server:
  port: 8383

logging:
  level:
    guru.qa.countryservice: DEBUG
    org.springframework.grpc: DEBUG

soap:
  wsdl:
    path: /ws/countries.wsdl